openapi: 3.1.0
x-contract-scope: target-state
info:
  title: Usage Insights API
  version: '0.1.0-draft'
  contact:
    name: Workspace Development Team
    email: dev@workspace.example.com
    url: https://api.example.com/support
  description: |
    使用统计与指标接口定义。

    - 对应设计目标：7.c 使用统计
    - 功能映射：FRONTEND-FUNCTIONALITY-MAPPING §9
    - 设计校验：FRONTEND-DESIGN-VALIDATION-REPORT 表格「Usage Dashboard」
servers:
  - url: https://api.example.com
    description: 生产环境
  - url: https://sandbox.example.com
    description: 沙箱环境
tags:
  - name: Usage
    description: 使用统计数据
paths:
  /api/usage/summary:
    get:
      operationId: getUsageSummary
      x-contract-scope: current
      summary: 获取总体使用概览
      description: 返回核心指标（调用量、耗时、成功率）以及同比数据。
      tags:
        - Usage
      security:
        - BearerAuth: []
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 7d
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UsageSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/usage/breakdown:
    get:
      operationId: getUsageBreakdown
      x-contract-scope: current
      summary: 获取模块使用分解
      description: 按模块与时间粒度统计使用量、耗时与成本。
      tags:
        - Usage
      security:
        - BearerAuth: []
      parameters:
        - name: metric
          in: query
          schema:
            type: string
            enum: [requests, latency, cost]
            default: requests
        - name: granularity
          in: query
          schema:
            type: string
            enum: [hour, day]
            default: day
        - name: range
          in: query
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 7d
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UsageBreakdown'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/usage/users/top:
    get:
      operationId: getTopUsageUsers
      x-contract-scope: current
      summary: 获取高使用量用户
      description: 列出使用量最高的用户及其关键指标。
      tags:
        - Usage
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TopUserUsage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/usage/anomalies:
    get:
      operationId: getUsageAnomalies
      x-contract-scope: current
      summary: 异常检测
      description: 返回阈值超标或异常波动的指标。
      tags:
        - Usage
      security:
        - BearerAuth: []
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [24h, 7d]
            default: 24h
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/UsageAnomaly'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/usage/export:
    post:
      operationId: exportUsageData
      x-contract-scope: current
      summary: 导出使用统计
      description: 创建使用统计导出任务并返回任务票据。
      tags:
        - Usage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [range, format]
              properties:
                range:
                  type: string
                  enum: [7d, 30d, 90d]
                format:
                  type: string
                  enum: [csv, xlsx]
                metrics:
                  type: array
                  items:
                    type: string
      responses:
        '202':
          description: 导出任务已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExportTicket'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ApiResponse:
      type: object
      description: 使用统计接口的通用响应。
      required: [success]
      properties:
        success:
          type: boolean
          description: 请求是否成功。
        error:
          $ref: '#/components/schemas/ErrorInfo'
          description: 失败时的错误信息。
    ErrorResponse:
      type: object
      description: 使用统计接口统一错误结构。
      properties:
        success:
          type: boolean
          enum: [false]
          description: 恒为 false。
        error:
          $ref: '#/components/schemas/ErrorInfo'
          description: 错误详情。
      required: [success, error]
    ErrorInfo:
      type: object
      description: 错误信息结构。
      properties:
        code:
          type: string
          description: 错误码。
        message:
          type: string
          description: 错误说明。
        details:
          nullable: true
          description: 可选调试信息。
    UsageSummary:
      type: object
      description: 总体使用概览指标。
      properties:
        totalRequests:
          type: integer
          description: 总请求数。
        p95LatencyMs:
          type: number
          description: P95 延迟（毫秒）。
        successRate:
          type: number
          minimum: 0
          maximum: 1
          description: 成功率（0-1）。
        totalCost:
          type: number
          description: 总成本。
        changeWeek:
          type: number
          description: 周同比变化。
        changeMonth:
          type: number
          description: 月同比变化。
        chart:
          type: array
          description: 趋势图数据。
          items:
            type: object
            properties:
              date:
                type: string
                description: 统计日期。
              requests:
                type: integer
                description: 请求量。
              latencyMs:
                type: number
                description: 平均延迟（毫秒）。
    UsageBreakdown:
      type: object
      description: 使用分解数据。
      properties:
        metric:
          type: string
          description: 指标名称。
        points:
          type: array
          description: 分解指标点位。
          items:
            type: object
            properties:
              timestamp:
                type: string
                description: 时间戳。
              module:
                type: string
                description: 模块名称。
              value:
                type: number
                description: 指标值。
    TopUserUsage:
      type: object
      description: 高使用量用户统计。
      properties:
        userId:
          type: string
          description: 用户 ID。
        displayName:
          type: string
          description: 用户名。
        totalRequests:
          type: integer
          description: 请求次数。
        totalCost:
          type: number
          description: 累计成本。
        lastActiveAt:
          type: string
          format: date-time
          description: 最近活跃时间。
    UsageAnomaly:
      type: object
      description: 使用异常数据点。
      properties:
        metric:
          type: string
          description: 指标名称。
        timestamp:
          type: string
          description: 异常时间。
        actual:
          type: number
          description: 实际值。
        expected:
          type: number
          description: 期望值。
        deviation:
          type: number
          description: 偏差值。
    ExportTicket:
      type: object
      description: 导出任务票据。
      properties:
        taskId:
          type: string
          description: 任务 ID。
        status:
          type: string
          enum: [queued, processing, completed, failed]
          description: 任务状态。
        downloadUrl:
          type: string
          description: 完成后的下载链接。
        expiresAt:
          type: string
          format: date-time
          description: 下载链接过期时间。
security:
  - BearerAuth: []
