openapi: 3.1.0
x-contract-scope: target-state
info:
  title: Billing API
  version: '0.1.0-draft'
  contact:
    name: Workspace Development Team
    email: dev@workspace.demo-platform.cn
    url: https://api.demo-platform.cn/support
  description: |
    账务与支付接口定义。

    - 对应设计目标：7.b 充值消费
    - 功能映射：FRONTEND-FUNCTIONALITY-MAPPING §6
    - 设计校验：FRONTEND-DESIGN-VALIDATION-REPORT 表格「Billing Center」
servers:
  - url: https://api.demo-platform.cn
    description: 生产环境
  - url: https://sandbox.demo-platform.cn
    description: 沙箱环境
tags:
  - name: Billing
    description: 账务概览、交易记录
  - name: Payments
    description: 充值、退款与支付回调
paths:
  /api/billing/summary:
    get:
      operationId: getBillingSummary
      x-contract-scope: current
      summary: 获取账务概览
      description: 返回当前余额、信用额度、最近消费与优惠券状态。
      tags:
        - Billing
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BillingSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/billing/transactions:
    get:
      operationId: listBillingTransactions
      x-contract-scope: current
      summary: 获取交易记录
      description: 按条件分页查询充值、消费等账务流水。
      tags:
        - Billing
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [topup, consumption, refund, adjustment]
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/Transaction'
                          pagination:
                            $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/billing/pricing:
    get:
      operationId: listPricingPlans
      x-contract-scope: current
      summary: 查询套餐与价格
      description: 返回当前可购买的套餐与增值服务价格配置。
      tags:
        - Billing
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PricingPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/billing/top-ups:
    post:
      operationId: createTopUpOrder
      x-contract-scope: deferred
      x-deferred-reason: money-flow-requires-business-review
      summary: 创建充值订单
      description: 调用聚合支付网关，返回支付链接与签名，供客户端跳转。
      tags:
        - Payments
      security:
        - BearerAuth: []
      x-performance:
        timeoutMs: 8000
        retryPolicy: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTopUpRequest'
      responses:
        '201':
          description: 订单创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TopUpOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/billing/top-ups/{orderId}:
    get:
      operationId: getTopUpOrder
      x-contract-scope: current
      summary: 查询充值订单状态
      description: 根据订单号查询充值状态与支付信息。
      tags:
        - Payments
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TopUpOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/billing/refunds:
    post:
      operationId: createRefundRequest
      x-contract-scope: deferred
      x-deferred-reason: money-flow-requires-business-review
      summary: 发起退款
      description: 针对指定交易发起退款申请，返回受理记录。
      tags:
        - Payments
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        '202':
          description: 退款申请已受理
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RefundTicket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/billing/usage:
    get:
      operationId: getBillingUsage
      x-contract-scope: current
      summary: 查询余额使用详情
      description: 细化展示不同模块（工作流、对话流等）的扣费情况。
      tags:
        - Billing
      security:
        - BearerAuth: []
      parameters:
        - name: granularity
          in: query
          schema:
            type: string
            enum: [daily, weekly, monthly]
            default: daily
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UsageBreakdown'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/billing/webhook:
    post:
      operationId: handleBillingWebhook
      x-contract-scope: deferred
      x-deferred-reason: server-callback-not-frontend-current-state
      summary: 支付回调
      description: 聚合支付网关回调，包含签名校验与 nonce 防重放逻辑。
      tags:
        - Payments
      x-webhook-type: external
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookPayload'
      responses:
        '200':
          description: 回调已接收
        '400':
          description: 签名校验失败
  /api/billing/signature/verify:
    post:
      operationId: verifyBillingSignature
      x-contract-scope: deferred
      x-deferred-reason: money-flow-requires-business-review
      summary: 校验签名示例
      description: 提供客户端侧调试接口，验证签名参数是否符合规范。
      tags:
        - Payments
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload, signature, nonce, timestamp]
              properties:
                payload:
                  type: string
                signature:
                  type: string
                nonce:
                  type: string
                timestamp:
                  type: integer
      responses:
        '200':
          description: 校验结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ApiResponse:
      type: object
      description: 标准化的账务接口响应。
      required: [success]
      properties:
        success:
          type: boolean
          description: 请求是否成功。
        data:
          nullable: true
          description: 成功时返回的数据载荷。
        error:
          $ref: '#/components/schemas/ErrorInfo'
          description: 失败时的错误信息。
    ErrorResponse:
      type: object
      description: 账务接口统一错误格式。
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
          description: 恒为 false。
        error:
          $ref: '#/components/schemas/ErrorInfo'
          description: 错误详情。
    ErrorInfo:
      type: object
      description: 错误信息结构。
      properties:
        code:
          type: string
          description: 业务错误码。
        message:
          type: string
          description: 错误描述。
        details:
          nullable: true
          description: 附加调试信息。
    Pagination:
      type: object
      description: 分页信息。
      properties:
        page:
          type: integer
          description: 当前页码，从 1 开始。
        pageSize:
          type: integer
          description: 每页条数。
        total:
          type: integer
          description: 总记录数。
        hasMore:
          type: boolean
          description: 是否还有下一页。
    BillingSummary:
      type: object
      description: 账务概览信息。
      properties:
        balance:
          type: number
          description: 当前可用余额。
        currency:
          type: string
          description: 余额币种。
        creditLimit:
          type: number
          description: 授信额度。
        reservedAmount:
          type: number
          description: 已预留金额。
        coupons:
          type: array
          description: 可用优惠券列表。
          items:
            type: object
            properties:
              code:
                type: string
                description: 优惠券码。
              expiresAt:
                type: string
                format: date-time
                description: 到期时间。
              remaining:
                type: number
                description: 剩余金额或次数。
        updatedAt:
          type: string
          format: date-time
          description: 最近更新时间。
    Transaction:
      type: object
      required: [id, type, amount, createdAt]
      description: 账务交易记录。
      properties:
        id:
          type: string
          description: 交易标识。
        type:
          type: string
          description: 交易类型。
        amount:
          type: number
          description: 交易金额。
        currency:
          type: string
          description: 金额币种。
        status:
          type: string
          enum: [pending, completed, failed, refunded]
          description: 当前状态。
        createdAt:
          type: string
          format: date-time
          description: 创建时间。
        referenceId:
          type: string
          description: 相关引用或订单号。
        metadata:
          type: object
          additionalProperties: true
          description: 扩展字段。
    PricingPlan:
      type: object
      description: 套餐或价格配置。
      properties:
        planId:
          type: string
          description: 套餐标识。
        name:
          type: string
          description: 套餐名称。
        description:
          type: string
          description: 套餐描述。
        price:
          type: number
          description: 售价。
        currency:
          type: string
          description: 币种。
        billingCycle:
          type: string
          enum: [monthly, yearly]
          description: 计费周期。
        includedCredits:
          type: number
          description: 包含的额度。
        overagePrice:
          type: number
          description: 超额计费单价。
    CreateTopUpRequest:
      type: object
      required: [amount, channel]
      description: 创建充值订单的请求体。
      properties:
        amount:
          type: number
          minimum: 1
          description: 充值金额。
        currency:
          type: string
          default: CNY
          description: 交易币种，默认人民币。
        channel:
          type: string
          enum: [alipay, wechat, unionpay]
          description: 支付渠道。
        callbackUrl:
          type: string
          format: uri
          description: 支付网关回调地址。
    TopUpOrder:
      type: object
      description: 充值订单信息。
      properties:
        orderId:
          type: string
          description: 订单标识。
        status:
          type: string
          enum: [initialized, pending, succeeded, failed]
          description: 当前订单状态。
        amount:
          type: number
          description: 订单金额。
        currency:
          type: string
          description: 金额币种。
        paymentUrl:
          type: string
          format: uri
          description: 支付跳转链接。
        signature:
          type: string
          description: 签名信息。
        nonce:
          type: string
          description: 随机数，用于防重放。
        createdAt:
          type: string
          format: date-time
          description: 创建时间。
    RefundRequest:
      type: object
      required: [transactionId, amount]
      description: 发起退款的请求。
      properties:
        transactionId:
          type: string
          description: 原交易 ID。
        amount:
          type: number
          description: 退款金额。
        reason:
          type: string
          description: 退款原因。
        metadata:
          type: object
          additionalProperties: true
          description: 扩展字段。
    RefundTicket:
      type: object
      description: 退款处理记录。
      properties:
        refundId:
          type: string
          description: 退款单标识。
        status:
          type: string
          enum: [processing, succeeded, failed]
          description: 当前处理状态。
        processedAt:
          type: string
          format: date-time
          description: 处理完成时间。
        message:
          type: string
          description: 处理备注。
    UsageBreakdown:
      type: object
      description: 使用情况分解。
      properties:
        currency:
          type: string
          description: 统计币种。
        total:
          type: number
          description: 总计金额。
        items:
          type: array
          description: 模块使用明细。
          items:
            type: object
            properties:
              module:
                type: string
                description: 模块名称。
              amount:
                type: number
                description: 对应金额。
              percentage:
                type: number
                description: 金额占比。
    WebhookPayload:
      type: object
      required: [eventType, signature, nonce, timestamp, data]
      description: 支付回调负载。
      properties:
        eventType:
          type: string
          description: 事件类型。
        signature:
          type: string
          description: 验签字段。
        nonce:
          type: string
          description: 随机数。
        timestamp:
          type: integer
          description: 事件时间戳。
        data:
          type: object
          additionalProperties: true
          description: 具体事件内容。
security:
  - BearerAuth: []
