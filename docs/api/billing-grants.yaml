openapi: 3.1.0
x-contract-scope: current
info:
  title: Billing Grants API
  version: '0.1.0-draft'
  contact:
    name: Workspace Development Team
    email: dev@workspace.demo-platform.cn
    url: https://api.demo-platform.cn/support
  description: |
    赠送额度管理接口定义。

    - 对应设计目标：5.b 赠送额度管理
    - 功能映射：FRONTEND-FUNCTIONALITY-MAPPING §4
    - 设计校验：FRONTEND-DESIGN-VALIDATION-REPORT 表格「Billing System」
servers:
  - url: https://api.demo-platform.cn
    description: 生产环境
  - url: https://sandbox.demo-platform.cn
    description: 沙箱环境
tags:
  - name: Grants
    description: 赠送记录管理接口
  - name: Grant Policies
    description: 赠送策略管理接口
  - name: Grant Approvals
    description: 赠送审批流程接口
  - name: Grant Templates
    description: 赠送模板管理接口
paths:
  /api/billing/grants:
    get:
      operationId: listGrants
      summary: 获取赠送记录列表
      description: 分页查询赠送记录，支持按状态、类型、时间等条件过滤。
      tags:
        - Grants
      security:
        - BearerAuth: []
      parameters:
        - name: recipientId
          in: query
          description: 接收者ID过滤
          schema:
            type: string
        - name: granterId
          in: query
          description: 赠送者ID过滤
          schema:
            type: string
        - name: type
          in: query
          description: 赠送类型过滤
          schema:
            type: string
            enum: [manual, automatic, compensation, referral, activity]
        - name: status
          in: query
          description: 状态过滤
          schema:
            type: string
            enum: [pending, approved, issued, revoked, expired]
        - name: policyId
          in: query
          description: 策略ID过滤
          schema:
            type: string
        - name: from
          in: query
          description: 创建时间起始（ISO8601）
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: 创建时间结束（ISO8601）
          schema:
            type: string
            format: date-time
        - name: expiresFrom
          in: query
          description: 过期时间起始（ISO8601）
          schema:
            type: string
            format: date-time
        - name: expiresTo
          in: query
          description: 过期时间结束（ISO8601）
          schema:
            type: string
            format: date-time
        - name: amountMin
          in: query
          description: 最小金额过滤
          schema:
            type: number
        - name: amountMax
          in: query
          description: 最大金额过滤
          schema:
            type: number
        - name: currency
          in: query
          description: 货币类型过滤
          schema:
            type: string
        - name: sortBy
          in: query
          description: 排序字段
          schema:
            type: string
            enum: [createdAt, amount, expiresAt, status]
            default: createdAt
        - name: sortOrder
          in: query
          description: 排序方向
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/GrantSummary'
                          pagination:
                            $ref: '#/components/schemas/Pagination'
                          summary:
                            $ref: '#/components/schemas/GrantsSummary'
              examples:
                default:
                  summary: 赠送记录列表示例
                  value:
                    success: true
                    data:
                      items:
                        - id: grant-123
                          type: "manual"
                          amount: 100.00
                          currency: "CNY"
                          reason: "新用户奖励"
                          status: "issued"
                          recipientId: "user-456"
                          granterId: "admin-789"
                          createdAt: "2025-10-20T10:30:00Z"
                          issuedAt: "2025-10-20T10:35:00Z"
                          expiresAt: "2025-12-20T10:30:00Z"
                        - id: grant-456
                          type: "activity"
                          amount: 50.00
                          currency: "CNY"
                          reason: "完成任务奖励"
                          status: "pending"
                          recipientId: "user-123"
                          granterId: "system-auto"
                          createdAt: "2025-10-22T14:20:00Z"
                          issuedAt: null
                          expiresAt: "2025-11-22T14:20:00Z"
                      pagination:
                        page: 1
                        pageSize: 20
                        total: 156
                        hasMore: true
                      summary:
                        totalCount: 156
                        totalAmount: 15680.50
                        issuedAmount: 12450.00
                        pendingAmount: 3230.50
                        currency: "CNY"
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createGrant
      summary: 创建赠送记录
      description: 创建新的赠送记录，支持手动和自动赠送。
      tags:
        - Grants
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGrantRequest'
            example:
              recipientId: "user-123"
              type: "manual"
              amount: 100.00
              currency: "CNY"
              reason: "新用户欢迎奖励"
              description: "感谢您注册我们的服务"
              expiresAt: "2025-12-20T10:30:00Z"
              policyId: "policy-welcome"
              metadata:
                source: "admin-panel"
                campaign: "welcome2024"
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GrantDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 无权限创建赠送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 赠送策略限制或用户配额不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [success, error]
      description: 赠送接口统一错误响应。
      properties:
        success:
          type: boolean
          enum: [false]
          description: 恒为 false。
        error:
          $ref: '#/components/schemas/ErrorInfo'
          description: 错误信息。
    ErrorInfo:
      type: object
      description: 错误详情结构。
      properties:
        code:
          type: string
          description: 错误码。
        message:
          type: string
          description: 错误描述。
        details:
          type: string
          nullable: true
          description: 附加调试信息。
    ApiResponse:
      type: object
      required: [success]
      description: 通用响应包装。
      properties:
        success:
          type: boolean
          description: 请求是否成功。
        error:
          $ref: '#/components/schemas/ErrorInfo'
          description: 失败信息。
    Pagination:
      type: object
      description: 分页信息。
      properties:
        page:
          type: integer
          description: 当前页码。
        pageSize:
          type: integer
          description: 每页条数。
        total:
          type: integer
          description: 总记录数。
        hasMore:
          type: boolean
          description: 是否存在下一页。
    GrantSummary:
      type: object
      required: [id, type, amount, currency, status, recipientId, granterId, createdAt]
      description: 赠送记录概要信息。
      properties:
        id:
          type: string
          description: 赠送记录ID。
        type:
          type: string
          enum: [manual, automatic, compensation, referral, activity]
          description: 赠送类型。
        amount:
          type: number
          description: 赠送金额。
        currency:
          type: string
          description: 货币类型。
        status:
          type: string
          enum: [pending, approved, issued, revoked, expired]
          description: 赠送状态。
        recipientId:
          type: string
          description: 接收者ID。
        granterId:
          type: string
          description: 赠送者ID。
        policyId:
          type: string
          description: 策略ID。
        reason:
          type: string
          description: 赠送原因。
        createdAt:
          type: string
          format: date-time
          description: 创建时间。
    GrantsSummary:
      type: object
      description: 赠送汇总信息。
      properties:
        totalCount:
          type: integer
          description: 总赠送数。
        totalAmount:
          type: number
          description: 总赠送金额。
        issuedAmount:
          type: number
          description: 已发放金额。
        pendingAmount:
          type: number
          description: 待处理金额。
        currency:
          type: string
          description: 货币类型。
    GrantDetail:
      allOf:
        - $ref: '#/components/schemas/GrantSummary'
        - type: object
          required: [description, recipient, granter]
          properties:
            description:
              type: string
              description: 赠送描述。
            recipient:
              $ref: '#/components/schemas/UserInfo'
              description: 接收者信息。
            granter:
              $ref: '#/components/schemas/UserInfo'
              description: 赠送者信息。
            policy:
              $ref: '#/components/schemas/GrantPolicySummary'
              description: 关联策略信息。
            approvalHistory:
              type: array
              items:
                $ref: '#/components/schemas/GrantApprovalHistory'
              description: 审批历史记录。
            auditLogs:
              type: array
              items:
                $ref: '#/components/schemas/GrantAuditLog'
              description: 审计日志记录。
            metadata:
              type: object
              additionalProperties: true
              description: 扩展元数据。
            updatedAt:
              type: string
              format: date-time
              description: 更新时间。
    CreateGrantRequest:
      type: object
      required: [recipientId, type, amount, currency, reason]
      description: 创建赠送请求体。
      properties:
        recipientId:
          type: string
          description: 接收者ID。
        type:
          type: string
          enum: [manual, automatic, compensation, referral, activity]
          description: 赠送类型。
        amount:
          type: number
          minimum: 0
          description: 赠送金额。
        currency:
          type: string
          description: 货币类型。
        reason:
          type: string
          description: 赠送原因。
        description:
          type: string
          description: 赠送描述。
        expiresAt:
          type: string
          format: date-time
          description: 过期时间。
        policyId:
          type: string
          description: 关联策略ID。
        metadata:
          type: object
          additionalProperties: true
          description: 扩展元数据。
    GrantApprovalHistory:
      type: object
      description: 赠送审批历史。
      properties:
        id:
          type: string
          description: 审批记录ID。
        action:
          type: string
          description: 审批动作。
        actor:
          type: object
          properties:
            id:
              type: string
              description: 操作者ID。
            name:
              type: string
              description: 操作者姓名。
          description: 操作者信息。
        timestamp:
          type: string
          format: date-time
          description: 操作时间。
        comment:
          type: string
          description: 审批意见。
    GrantAuditLog:
      type: object
      required: [id, action, actor, timestamp, grantId]
      description: 赠送审计日志。
      properties:
        id:
          type: string
          description: 日志ID。
        action:
          type: string
          enum: [create, update, approve, reject, issue, revoke, view]
          description: 操作类型。
        actor:
          $ref: '#/components/schemas/UserInfo'
          description: 操作人信息。
        timestamp:
          type: string
          format: date-time
          description: 操作时间。
        grantId:
          type: string
          description: 赠送记录ID。
        previousValues:
          type: object
          additionalProperties: true
          description: 修改前的值。
        newValues:
          type: object
          additionalProperties: true
          description: 修改后的值。
        ipAddress:
          type: string
          description: IP地址。
        userAgent:
          type: string
          description: 用户代理。
        sessionId:
          type: string
          description: 会话ID。
        requestId:
          type: string
          description: 请求ID。
        metadata:
          type: object
          additionalProperties: true
          description: 扩展元数据。
    GrantPolicySummary:
      type: object
      required: [id, name, type, status, createdAt, createdBy]
      description: 赠送策略概要信息。
      properties:
        id:
          type: string
          description: 策略ID。
        name:
          type: string
          description: 策略名称。
        description:
          type: string
          description: 策略描述。
        type:
          type: string
          enum: [manual, automatic, compensation, referral, activity]
          description: 策略类型。
        status:
          type: string
          enum: [active, inactive, draft]
          description: 策略状态。
        createdAt:
          type: string
          format: date-time
          description: 创建时间。
        createdBy:
          type: string
          description: 创建者ID。
        usageCount:
          type: integer
          description: 使用次数。
        lastUsedAt:
          type: string
          format: date-time
          description: 最后使用时间。
    UserInfo:
      type: object
      description: 用户信息。
      properties:
        id:
          type: string
          description: 用户ID。
        name:
          type: string
          description: 用户姓名。
        email:
          type: string
          format: email
          description: 用户邮箱。
        avatarUrl:
          type: string
          format: uri
          description: 头像URL。
security:
  - BearerAuth: []
